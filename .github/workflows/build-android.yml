name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.env
      - customize.py
      - icons/**
      - .github/workflows/build-android.yml

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    # A commit message containing [skip apk] runs the other workflows but not this one.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip apk]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Load config.env
        run: |
          set -euo pipefail
          grep -E '^[A-Z_]+=' config.env >> "$GITHUB_ENV"
          echo "Loaded:"; grep -E '^[A-Z_]+=' config.env
          # Smaller runners (private repos) have 7 GB RAM — shrink the Gradle heap there.
          TOTAL_GB=$(free -g | awk '/Mem:/{print $2}')
          echo "Runner RAM: ${TOTAL_GB} GB, CPUs: $(nproc)"
          if [ "$TOTAL_GB" -lt 12 ]; then echo "GRADLE_HEAP=5g" >> "$GITHUB_ENV"; fi

      - name: Check repository secrets
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          missing=""
          for v in TG_API_ID TG_API_HASH KEYSTORE_BASE64 KEYSTORE_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          echo "All 4 secrets present."

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/local/.ghcup \
                      /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules \
                      /usr/local/share/powershell /usr/local/julia* 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" "platform-tools" >/dev/null
          echo "NDK: $(ls "$ANDROID_HOME/ndk")"
          echo "CMake: $(ls "$ANDROID_HOME/cmake")"

      - name: Get Telegram source (pinned commit, with submodules)
        run: |
          set -euo pipefail
          git init -q telegram
          cd telegram
          git remote add origin https://github.com/DrKLO/Telegram.git
          git fetch --depth 1 origin "$TELEGRAM_COMMIT"
          git checkout -q --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          echo "Telegram version: $(grep '^APP_VERSION_NAME=' gradle.properties)"
          du -sh . | tail -1

      - name: Apply Chihuahua customizations
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ACTIVATION_CODE: ${{ secrets.ACTIVATION_CODE }}
        run: python3 customize.py telegram

      - name: Install signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > telegram/TMessagesProj/config/release.keystore
          ls -la telegram/TMessagesProj/config/release.keystore

      - name: Build APK (this takes 1–3 hours)
        working-directory: telegram
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace --console=plain 2>&1 | tee ../build.log

      - name: Collect APK
        id: collect
        run: |
          set -euo pipefail
          APK=$(find telegram/TMessagesProj_App/build/outputs/apk -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then echo "::error::No APK produced"; exit 1; fi
          VERSION=$(grep '^APP_VERSION_NAME=' telegram/gradle.properties | cut -d= -f2)
          SAFE_NAME=$(echo "$APP_NAME" | tr -cd '[:alnum:]')
          NAME="${SAFE_NAME}-${VERSION}-${BUILD_ABI}.apk"
          mkdir -p out && cp "$APK" "out/$NAME"
          sha256sum "out/$NAME" | tee out/SHA256SUMS.txt
          ls -la out
          echo "apk=out/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### APK built"
            echo "- File: **$NAME** ($(du -h "out/$NAME" | cut -f1))"
            echo "- SHA-256: \`$(cut -d' ' -f1 out/SHA256SUMS.txt)\`"
            echo "- Download it from the **Releases** page of this repository."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          path: out/
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.collect.outputs.version }}-build${{ github.run_number }}"
          gh release create "$TAG" "${{ steps.collect.outputs.apk }}" out/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$APP_NAME ${{ steps.collect.outputs.version }} (build ${{ github.run_number }})" \
            --notes "Telegram ${{ steps.collect.outputs.version }} source, commit ${TELEGRAM_COMMIT:0:10}. Max accounts: ${MAX_ACCOUNTS}. ABI: ${BUILD_ABI}. Open this page on your phone and tap the .apk to install."
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "- Release page: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Record build status (branch build-status)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p status && cd status
          git init -q && git checkout -q -b build-status
          {
            echo "result=${{ job.status }}"
            echo "run=${{ github.run_number }}"
            echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "apk=${{ steps.collect.outputs.name }}"
            echo "version=${{ steps.collect.outputs.version }}"
            echo "finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > STATUS
          if [ -f ../build.log ]; then
            grep -n -E 'error:|error\b|FAILED|What went wrong|Exception|fatal|No space left' ../build.log | grep -v -E 'warning' | tail -150 > build-errors.txt
            tail -n 250 ../build.log > build-log-tail.txt
          fi
          git add -A
          git -c user.name=build-bot -c user.email=build-bot@users.noreply.github.com commit -q -m "build ${{ github.run_number }}: ${{ job.status }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-status
          echo "status recorded: ${{ job.status }}"
